services:
  # `suite-backend`, not `backend`: Notes and GAM each already have a service called
  # `backend`, and the frontend's nginx resolves its upstream by name.
  suite-backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      # The database, so a rebuild keeps it.
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/db/suite.db
      # Load-bearing. Left to default, the data directory is worked out from where
      # config.py sits, which in the image is /app/app/, so it lands outside the volume.
      - DATA_DIR=/app/data
      # Must match gecko-notes', GAM's and GVC's. No default: the app refuses to start.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Encrypts every provider key the suite holds. No default: the app refuses to
      # start. Losing it loses every stored key, so back it up apart from data/.
      - SUITE_ENCRYPTION_KEYS=${SUITE_ENCRYPTION_KEYS}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NOTES_BASE_URL=${NOTES_BASE_URL:-https://notes.geckopico.com}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Accounts (M6): the shared session cookie, where sign-in may send someone back to,
      # and the email behind verification, password reset and emailed codes.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - LOGIN_REDIRECT_ORIGINS=${LOGIN_REDIRECT_ORIGINS:-https://notes.geckopico.com,https://assets.geckopico.com,https://gvc.geckopico.com}
      - APP_BASE_URL=${APP_BASE_URL:-https://suite.geckopico.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-20}
    # Never published to the host: the frontend's nginx proxies it. The other apps reach
    # it through that same address (SUITE_BASE_URL in their .env).
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: the container runs migrations before uvicorn binds a port.
      start_period: 30s
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 18081 is Notes, 18082 GAM and 18083 GVC.
      - "${APP_PORT:-18084}:80"
    environment:
      # The CSP's connect-src; must agree with the backend's value.
      - NOTES_BASE_URL=${NOTES_BASE_URL:-https://notes.geckopico.com}
    depends_on:
      - suite-backend
    networks:
      - default

networks:
  default:
    name: suite_default
