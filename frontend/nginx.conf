# `suite-backend`, not `backend`: Notes and GAM both put a service called `backend` on the
# shared `web` network, and another would make that name resolve to any of them.
upstream backend {
    server suite-backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The gateway. Chat calls can stream (Server-Sent Events) and can run for minutes, so
    # buffering is off and the read timeout is long. Buffered, every frame would wait for
    # the end and a stream would become one long silence. Ahead of /api/ so it wins.
    location ^~ /api/v1/ai/ {
        proxy_pass http://backend/api/v1/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # A conversation with pictures attached is megabytes of base64.
        client_max_body_size 50m;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Hashed filenames, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # As GVC's: connect-src carries the Notes origin for the browser-side session
        # fetch, substituted from NOTES_BASE_URL at container start. The sha256 is
        # index.html's inline theme script; csp.test.ts recomputes it and fails if the two
        # drift. No GAM origin: this app shows no media.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-k5/2A0I5Mwg2n/V9CEukpiKkBRPF23IJ/Ucem02Iz78='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' ${NOTES_BASE_URL}; frame-ancestors 'self'";
    }
}
