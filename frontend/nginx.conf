# `suite-backend`, not `backend`: Notes and GAM both put a service called `backend` on the
# shared `web` network, and another would make that name resolve to any of them.
upstream backend {
    server suite-backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The gateway. Chat calls can stream (Server-Sent Events) and can run for minutes, so
    # buffering is off and the read timeout is long. Buffered, every frame would wait for
    # the end and a stream would become one long silence. Ahead of /api/ so it wins.
    location ^~ /api/v1/ai/ {
        proxy_pass http://backend/api/v1/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # A conversation with pictures attached is megabytes of base64.
        client_max_body_size 50m;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    # fal jobs carry their input pictures inline: an image edit takes up to ten, each a
    # base64 data URI of up to 8 MB, so one request can be most of 100 MB. Under the
    # gateway's 50m, those would be refused with a 413 that says nothing about fal.
    location ^~ /api/v1/ai/media/ {
        proxy_pass http://backend/api/v1/ai/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Audio for transcription is the request body: hours of FLAC. Same long read timeout as
    # the gateway, because Deepgram holds the connection while it transcribes.
    location ^~ /api/v1/ai/speech/ {
        proxy_pass http://backend/api/v1/ai/speech/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        client_max_body_size 300m;
        proxy_read_timeout 1900s;
        proxy_send_timeout 900s;
    }

    # Live dictation is a websocket (app/speech/live.py). The blocks above clear the
    # Connection header for keepalive, which would strip the upgrade, so this path passes
    # it through. Long read timeout: a pause in speech is silence on the wire, and a person
    # can dictate for many minutes. Longest prefix wins, so this beats /api/v1/ai/speech/.
    location ^~ /api/v1/ai/speech/stt/stream {
        proxy_pass http://backend/api/v1/ai/speech/stt/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Hashed filenames, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # connect-src is the suite alone: it signs people in on its own pages. The sha256 is
        # index.html's inline theme script; csp.test.ts recomputes it and fails if the two
        # drift. No GAM origin: this app shows no media.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-k5/2A0I5Mwg2n/V9CEukpiKkBRPF23IJ/Ucem02Iz78='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'";
    }
}
