<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The suite is the hub the other three apps meet at, so its mark is theirs together:
       Notes' green, GAM's blue and GVC's violet as one ring, joined at a hub in the lime of
       GAM's gecko. The tile is slate, not any app's colour, because all four sit open in
       neighbouring tabs and at 16px the tile colour is what tells them apart. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="s0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <g>
    <path d="M33.40 9.04 A23 23 0 0 1 52.58 42.26 L44.08 38.02 A13.5 13.5 0 0 0 32.82 18.53 Z" fill="url(#s0)"/>
    <path d="M51.18 44.69 A23 23 0 0 1 12.82 44.69 L20.74 39.45 A13.5 13.5 0 0 0 43.26 39.45 Z" fill="url(#s1)"/>
    <path d="M11.42 42.26 A23 23 0 0 1 30.60 9.04 L31.18 18.53 A13.5 13.5 0 0 0 19.92 38.02 Z" fill="url(#s2)"/>
  </g>
  <g stroke="#bef264" stroke-width="3.2" stroke-linecap="round">
    <path d="M32.00 24.50 L32.00 18.00"/><path d="M38.50 35.75 L44.12 39.00"/><path d="M25.50 35.75 L19.88 39.00"/>
  </g>
  <circle cx="32" cy="32" r="7" fill="#bef264"/>
  <circle cx="32" cy="32" r="2.6" fill="#0f172a"/>
</svg>
